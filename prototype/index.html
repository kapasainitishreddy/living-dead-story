<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.topbar,.bottombar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{letter-spacing:.28em;font-weight:700;font-size:12px;opacity:.88}
.chip{pointer-events:auto;border:1px solid var(--line);background:rgba(6,9,16,.45);backdrop-filter:blur(18px);color:var(--paper);border-radius:999px;padding:10px 14px;font-size:12px}

h1{font-size:clamp(34px,7vw,66px);line-height:.92;margin:0 0 16px;letter-spacing:-.045em}
h2{font-size:clamp(26px,5vw,44px);line-height:1;margin:0 0 14px;letter-spacing:-.03em}
p{color:#c8cfdd;line-height:1.55;margin:0 0 18px}
.quote{font-family:Georgia,serif;font-size:clamp(18px,3.7vw,27px);line-height:1.45;color:#f3f1ea;margin:22px 0}
.actions{display:grid;gap:10px;margin-top:18px}
button.action{appearance:none;width:100%;text-align:left;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:16px 18px;background:rgba(255,255,255,.055);color:white;font:inherit;cursor:pointer;transition:.22s ease}
button.action:hover,button.action:focus{background:rgba(255,255,255,.11);transform:translateY(-1px);outline:none}
button.action strong{display:block;font-size:15px;margin-bottom:4px}
button.action span{font-size:12px;color:#aab3c7}
button.primary{background:linear-gradient(135deg,rgba(255,212,140,.18),rgba(145,185,255,.13));border-color:rgba(255,212,140,.28)}
.small{font-size:12px;color:#9da6b9}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%) translateY(20px);opacity:0;transition:.45s ease;pointer-events:none;background:rgba(5,7,12,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);padding:12px 16px;border-radius:999px;font-size:13px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#threadCard{display:flex;gap:14px;align-items:center;padding:15px;border-radius:18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);margin:18px 0}

.safe{font-size:12px;color:#aeb8cb;border-top:1px solid rgba(255,255,255,.1);padding-top:16px;margin-top:20px}
.safe a{color:#e7edf9}

function actions(items){

}

function pulse(){
  const opts=[
    {title:"I can barely carry anything",sub:"2-minute path. No pressure.",go:()=>signal('tiny')},
    {title:"I can do something small",sub:"5-minute path.",go:()=>signal('small')},
    {title:"I want to explore",sub:"Full scene and puzzle.",go:()=>signal('full')},
    {title:"Just stay with me",sub:"No objectives. Enter a quiet room.",go:sanctuary},
  ];
  setPanel(`<div class="eyebrow">Before we go</div><h2>What can you carry tonight?</h2><p>No score. No diagnosis. This only changes how much the game asks of you.</p>${actions(opts)}`);
  bind(opts);
}
function signal(mode){
  sceneMood.target=.18;
  const opts=[
    {title:"Follow the radio signal",sub:"The impossible platform is beneath Central Station.",primary:true,go:()=>station(mode)},
    {title:"Inspect the photograph",sub:"Someone in it has been erased.",go:()=>photo(mode)}
  ];
  setPanel(`<div class="eyebrow">Signal 001</div><h2>â€œPLATFORM 6 DOES NOT EXIST.â€</h2>
  <p>Your dead radio clicks on by itself. A voice whispers the same sentence three times.</p>
  <p class="quote">â€œDo not board the 3:17 train.â€</p>
  <p>On the table beside it is a photograph you don't remember taking.</p>${actions(opts)}`);
  bind(opts);
}
function station(mode){
  sceneMood.target=.28;

    {title:"Touch the warm ticket",sub:"It has today's date and your handwriting.",go:()=>realAction(mode,'curiosity')},
    {title:"Ask the silent conductor",sub:"He points at the dark tunnel.",go:()=>realAction(mode,'connection')},
    {title:"Leave",sub:"Nothing is lost. You can return later.",go:start}
  ];
  setPanel(`<div class="eyebrow">Central Station Â· Platform 6</div><h2>The train has no destination.</h2>

  <p class="quote">Somewhere in the tunnel, something knocks back.</p>${actions(opts)}`);
  bind(opts);
}
function photo(mode){
  const opts=[
    {title:"Turn the photograph over",sub:"A message is written behind it.",go:()=>realAction(mode,'memory')},
    {title:"Put it away",sub:"You don't have to open every door tonight.",go:start}
  ];
  setPanel(`<div class="eyebrow">Evidence</div><h2>Someone is missing from the picture.</h2>
  <p>Four people are standing around a birthday cake. There are five plates.</p>
  <p>Where the fifth person should be, the image isn't torn. It is simply unfinished.</p>${actions(opts)}`);
  bind(opts);
}

    ["Skip this","The story still continues."]

    ["Walk to another room and back","About one minute."],
    ["Send someone a low-pressure message","Even a meme counts."],
    ["Get water or make something warm","Tea, coffee, anything."],
    ["Step outside or to a window","Notice one thing you didn't see before."],
    ["Skip this","No punishment."]

  const acts=options.map((o,idx)=>({title:o[0],sub:o[1],primary:idx===0,go:()=>powerTrain(thread, idx===options.length-1)}));

    <p class="quote">A tiny action here can move something enormous there.</p>${actions(acts)}`);
  bind(acts);
}
